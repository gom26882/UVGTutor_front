<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuto UVG | Panel del tutor</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header class="encabezado">
        <a class="marca" href="panel_tutor.html">
            <span class="marca-icono">UVG</span>
            <span>Tuto UVG</span>
        </a>
        <nav class="navegacion">
            <a href="panel_tutor.html">Panel</a>
            <a href="perfil_tutor.html">Mi perfil</a>
            <a href="buscar_tutores.html">Vista estudiante</a>
        </nav>
        <span class="usuario-chip" id="usuario-chip">Tutor UVG</span>
    </header>

    <main class="contenedor">
        <div class="titulo-pagina">
            <div>
                <span class="eyebrow">Panel de gestión</span>
                <h1>Hola, tutor</h1>
                <p class="subtitulo">Organiza las solicitudes de tu comunidad.</p>
            </div>
        </div>

        <section class="metricas">
            <article class="tarjeta metrica">
                <span class="subtitulo">Pendientes</span>
                <strong id="pendientes">0</strong>
            </article>
            <article class="tarjeta metrica">
                <span class="subtitulo">Confirmadas</span>
                <strong id="confirmadas">0</strong>
            </article>
            <article class="tarjeta metrica">
                <span class="subtitulo">Calificación</span>
                <strong class="calificacion">4.9 de 5</strong>
            </article>
        </section>

        <section class="panel tabla-wrap">
            <div class="titulo-pagina">
                <div>
                    <h2>Solicitudes recientes</h2>
                    <span class="subtitulo">Acepta o rechaza cada solicitud.</span>
                </div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Estudiante</th>
                        <th>Curso</th>
                        <th>Fecha</th>
                        <th>Modalidad</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-solicitudes"></tbody>
            </table>
        </section>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
