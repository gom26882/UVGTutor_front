<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tuto UVG | Buscar tutores</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header class="encabezado">
        <a class="marca" href="index.html">
            <span class="marca-icono">UVG</span>
            <span>Tuto UVG</span>
        </a>

        <nav class="navegacion">
            <a href="index.html">Explorar</a>
            <a href="historial.html">Mis tutorías</a>
            <a href="perfil_estudiante.html">Mi perfil</a>
        </nav>

        <div class="zona-usuario">
            <span id="usuario-chip" class="usuario-chip"></span>
            <button id="btn-cerrar-sesion" class="boton secundario pequeno" type="button">Cerrar sesión</button>
        </div>
    </header>

    <div class="contenedor">
        <section class="hero hero-compacto">
            <span class="eyebrow">Comunidad UVG</span>
            <h1>Encuentra a tu tutor ideal</h1>
            <p>
                Busca por curso, filtra por modalidad y precio, y reserva
                tu próxima tutoría en minutos.
            </p>
        </section>

        <section class="seccion-busqueda">
            <div class="barra-busqueda">
                <input id="busqueda" type="text" placeholder="Busca por nombre de tutor o curso..." autocomplete="off" spellcheck="false">
                <button id="btn-buscar" class="boton" type="button">Buscar</button>
            </div>

            <div class="contenido-busqueda">
                <aside class="filtros panel">
                    <div class="campo">
                        <label for="curso">Curso</label>
                        <select id="curso">
                            <option value="">Todos los cursos</option>
                            <option>Cálculo I</option>
                            <option>Física I</option>
                            <option>Programación</option>
                            <option>POO</option>
                            <option>Química</option>
                            <option>Precálculo</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="modalidad">Modalidad</label>
                        <select id="modalidad">
                            <option value="">Todas</option>
                            <option value="VIRTUAL">Virtual</option>
                            <option value="PRESENCIAL">Presencial</option>
                        </select>
                    </div>

                    <div class="campo">
                         <span class="etiqueta-campo">Precio máximo: <span id="precio-valor">Q200</span></span>
                         <input id="precio" type="range" min="50" max="200" step="5" value="200">
                    </div>

                    <button id="btn-limpiar" class="boton secundario ancho" type="button">Limpiar filtros</button>
                </aside>

                <div>
                    <p id="contador" class="subtitulo"></p>
                    <div id="lista-tutores" class="resultados"></div>
                </div>
            </div>
        </section>
    </div>

    <footer class="pie">Tuto UVG · Proyecto académico</footer>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
